name: NSPanel kernel CI/CD

on:
  push:
    branches:
      - fix/rockchip-gem-zero-size
    tags:
      - "v*"
    # Legacy log-export scripts may still push *.log files. Ignore those pushes
    # to prevent a log-upload loop while moving diagnostics to Actions artifacts.
    paths-ignore:
      - "**/*.log"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push must never cancel a kernel build already running on dell5300.
# GitHub retains one pending run per ref; newer pushes replace only that pending run.
concurrency:
  group: nspanel-kernel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate source changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check patch hygiene
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -Eeo pipefail
          if [ -n "$PR_BASE_SHA" ]; then
            git diff --check "$PR_BASE_SHA" "$GITHUB_SHA"
          elif [ -n "$BEFORE_SHA" ] && [[ ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            git diff --check "$BEFORE_SHA" "$GITHUB_SHA"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            echo "No parent commit available; whitespace check skipped."
          fi

          # Keep every Rockchip Realtek packed 802.11 header consistent.
          # frame_ctl is the first field and must be explicitly 2-byte aligned.
          for driver in rtl8188eu rtl8188fu rtl8189es rtl8189fs rtl8723bs rtl8723bu rtl8723cs rtl8723ds rtl8822be; do
            header="drivers/net/wireless/rockchip_wlan/$driver/include/ieee80211.h"
            if ! grep -Fq 'frame_ctl __attribute__((aligned(2)))' "$header"; then
              echo "::error::Missing 2-byte frame_ctl alignment in $header"
              exit 1
            fi
          done
          echo "All Rockchip Realtek frame_ctl declarations have explicit 2-byte alignment."

          # Prevent recurrence of snprintf destination/source overlap in thread names.
          if git grep -n -F 'rtw_sprintf(thread_name, 20, "%s-"ADPT_FMT, thread_name, ADPT_ARG(padapter));' -- drivers/net/wireless/rockchip_wlan; then
            echo "::error::Overlapping thread_name snprintf pattern remains in Rockchip wireless sources"
            exit 1
          fi

  build:
    name: Build and package on dell5300
    # Never execute untrusted fork code on the persistent self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: validate
    permissions:
      contents: write
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 240
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 2

      # Create the log before any runner/toolchain checks so even early failures
      # are retained and uploaded by the always() artifact step below.
      - name: Initialize build diagnostics
        shell: bash
        run: |
          set -Eeo pipefail
          LOG_FILE="$PWD/nspanel-kernel-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
          echo "NSPANEL_BUILD_LOG=$LOG_FILE" >> "$GITHUB_ENV"
          {
            printf '===== NSPanel kernel CI/CD started: %s =====\n' "$(date '+%Y-%m-%d %H:%M:%S %z')"
            printf '===== Repository: %s =====\n' "$GITHUB_REPOSITORY"
            printf '===== Ref: %s =====\n' "$GITHUB_REF"
            printf '===== Commit: %s =====\n' "$GITHUB_SHA"
            printf '===== Runner: %s =====\n' "$(hostname -f 2>/dev/null || hostname)"
          } | tee "$LOG_FILE"

      - name: Validate build environment
        shell: bash
        run: |
          set -Eeo pipefail
          exec > >(tee -a "$NSPANEL_BUILD_LOG") 2>&1
          for tool in make flock aarch64-unknown-linux-gnu-gcc depmod tar sha256sum; do
            command -v "$tool" >/dev/null || {
              echo "::error::Required build tool missing: $tool"
              exit 1
            }
          done
          test -s .config || {
            echo "::error::.config is missing or empty"
            exit 1
          }
          echo "===== Runner ====="
          hostname -f || hostname
          echo "===== Resources ====="
          nproc
          free -h
          df -h .
          echo "===== Cross compiler ====="
          aarch64-unknown-linux-gnu-gcc --version | head -n 1
          echo "===== Kernel configuration ====="
          grep -E '^(CONFIG_ARCH_ROCKCHIP|CONFIG_MODULES|CONFIG_DRM_ROCKCHIP)=' .config || true

      - name: Build kernel with bounded automatic repair
        id: build
        shell: bash
        run: |
          set -Eeo pipefail
          exec > >(tee -a "$NSPANEL_BUILD_LOG") 2>&1
          echo "===== Compiler version ====="
          aarch64-unknown-linux-gnu-gcc --version | head -n 1
          echo "===== Build started: $(date '+%Y-%m-%d %H:%M:%S %z') ====="

          BUILD_STATUS=1
          for attempt in 1 2 3; do
            echo "===== Kernel build attempt $attempt/3 ====="
            set +e
            ARCH=arm64 CROSS_COMPILE=aarch64-unknown-linux-gnu- make -j3 \
              HOSTCFLAGS="-Wall -Wmissing-prototypes -Wstrict-prototypes -O2 -fomit-frame-pointer -std=gnu89 -fcommon" \
              Image dtbs modules
            BUILD_STATUS=$?
            set -e
            if [ "$BUILD_STATUS" -eq 0 ]; then
              echo "===== Kernel build succeeded on attempt $attempt ====="
              break
            fi

            echo "===== Kernel build attempt $attempt failed: $BUILD_STATUS ====="
            if [ "$attempt" -eq 3 ] || [ "$GITHUB_REF" != "refs/heads/fix/rockchip-gem-zero-size" ]; then
              echo "::error::No further automatic repair/retry is permitted for this failure"
              exit "$BUILD_STATUS"
            fi

            echo "===== Searching and applying repository-wide known-safe fixes ====="
            if ! bash scripts/ci-autofix-known-warnings.sh "$NSPANEL_BUILD_LOG"; then
              echo "::error::No fully verified automatic repair matched the compiler diagnostics"
              exit "$BUILD_STATUS"
            fi
            git diff --check
            if git diff --quiet; then
              echo "::error::Automatic repair reported success but produced no source changes"
              exit "$BUILD_STATUS"
            fi

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- drivers/net/wireless/rockchip_wlan
            git commit -m "ci: apply verified Rockchip compiler warning fixes"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "===== Pushed automatic repair commit $(git rev-parse HEAD); retrying in this same run ====="
          done

          printf '\n===== BUILD EXIT STATUS: %s =====\n' "$BUILD_STATUS"
          printf '===== Build finished: %s =====\n' "$(date '+%Y-%m-%d %H:%M:%S %z')"
          echo "build_status=$BUILD_STATUS" >> "$GITHUB_OUTPUT"
          [ "$BUILD_STATUS" -eq 0 ]

      - name: Package kernel, DTBs and modules
        if: success()
        shell: bash
        run: |
          set -Eeo pipefail
          exec > >(tee -a "$NSPANEL_BUILD_LOG") 2>&1
          PACKAGE_ROOT="$PWD/dist/package"
          mkdir -p "$PACKAGE_ROOT/boot/dtb" "$PACKAGE_ROOT/config"

          test -s arch/arm64/boot/Image
          cp arch/arm64/boot/Image "$PACKAGE_ROOT/boot/Image"
          cp .config "$PACKAGE_ROOT/config/kernel.config"
          if [ -s System.map ]; then cp System.map "$PACKAGE_ROOT/boot/System.map"; fi

          DTB_COUNT=$(find arch/arm64/boot/dts -type f -name '*.dtb' | wc -l)
          if [ "$DTB_COUNT" -eq 0 ]; then
            echo "::error::No compiled DTB files found"
            exit 1
          fi
          find arch/arm64/boot/dts -type f -name '*.dtb' -exec cp --parents {} "$PACKAGE_ROOT/" \;

          ARCH=arm64 CROSS_COMPILE=aarch64-unknown-linux-gnu- make -j3 \
            HOSTCFLAGS="-Wall -Wmissing-prototypes -Wstrict-prototypes -O2 -fomit-frame-pointer -std=gnu89 -fcommon" \
            modules_install INSTALL_MOD_PATH="$PACKAGE_ROOT/rootfs"

          KERNEL_RELEASE=$(make -s ARCH=arm64 kernelrelease)
          test -d "$PACKAGE_ROOT/rootfs/lib/modules/$KERNEL_RELEASE"
          BUILD_COMMIT=$(git rev-parse HEAD)
          PACKAGE="$PWD/dist/nspanel-kernel-$KERNEL_RELEASE-${BUILD_COMMIT::12}.tar.gz"
          tar -czf "$PACKAGE" -C "$PACKAGE_ROOT" .
          sha256sum "$PACKAGE" > "$PACKAGE.sha256"

          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "commit=$BUILD_COMMIT"
            echo "ref=$GITHUB_REF"
            echo "kernel_release=$KERNEL_RELEASE"
            echo "dtb_count=$DTB_COUNT"
            echo "compiler=$(aarch64-unknown-linux-gnu-gcc -dumpfullversion)"
            echo "built_at=$(date --iso-8601=seconds)"
          } | tee dist/manifest.txt

      - name: Publish build summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            printf '%s\n\n' '## NSPanel kernel CI/CD'
            printf -- '- **Commit:** `%s`\n' "$GITHUB_SHA"
            printf -- '- **Ref:** `%s`\n' "$GITHUB_REF"
            printf -- '- **Build job:** `%s`\n' "$JOB_STATUS"
            if [ -n "${NSPANEL_BUILD_LOG:-}" ] && [ -f "$NSPANEL_BUILD_LOG" ]; then
              printf -- '- **Log:** `%s`\n' "$(basename "$NSPANEL_BUILD_LOG")"
              ERROR_COUNT=$(grep -Ec '(^| )error:|fatal error:|undefined reference|Error [0-9]+' "$NSPANEL_BUILD_LOG" || true)
              WARNING_COUNT=$(grep -Ec 'warning:' "$NSPANEL_BUILD_LOG" || true)
              printf -- '- **Errors:** %s\n' "$ERROR_COUNT"
              printf -- '- **Warnings:** %s\n\n' "$WARNING_COUNT"
              printf '%s\n' '### Last diagnostics'
              grep -n -E 'error:|fatal error:|undefined reference|Error [0-9]+' "$NSPANEL_BUILD_LOG" | tail -n 30 || true
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # One source of truth for logs: downloadable Actions artifacts, not commits
      # of generated log files back into the source repository.
      - name: Upload build diagnostics and deliverables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nspanel-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            nspanel-kernel-build-*.log
            dist/*.tar.gz
            dist/*.sha256
            dist/manifest.txt
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish versioned GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated build deliverables
        uses: actions/download-artifact@v4
        with:
          name: nspanel-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/dist/*.tar.gz
            release-assets/dist/*.sha256
            release-assets/dist/manifest.txt
