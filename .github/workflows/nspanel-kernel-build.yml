name: NSPanel kernel build

on:
  workflow_dispatch:
  push:
    branches:
      - __disabled_until_batch_fix__
    paths-ignore:
      - "**/*.log"

permissions:
  contents: write

concurrency:
  group: nspanel-kernel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build on dell5300
    runs-on: [self-hosted, linux, x64, nspanel-build]
    timeout-minutes: 240
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Verify cross toolchain
        shell: bash
        run: |
          set -o pipefail
          command -v make
          command -v aarch64-unknown-linux-gnu-gcc
          aarch64-unknown-linux-gnu-gcc --version | head -n 1
          test -s .config

      - name: Build kernel
        shell: bash
        run: |
          LOG_FILE="$PWD/nspanel-kernel-build-$(date '+%Y%m%d-%H%M%S')-${GITHUB_RUN_ID}.log"
          echo "NSPANEL_BUILD_LOG=$LOG_FILE" >> "$GITHUB_ENV"
          printf '===== NSPanel kernel build started: %s =====\n' "$(date '+%Y-%m-%d %H:%M:%S %z')" | tee "$LOG_FILE"
          printf '===== Commit: %s =====\n' "$GITHUB_SHA" | tee -a "$LOG_FILE"
          printf '===== Host: %s =====\n' "$(hostname -f)" | tee -a "$LOG_FILE"
          printf '===== Compiler: %s =====\n' "$(aarch64-unknown-linux-gnu-gcc -dumpfullversion)" | tee -a "$LOG_FILE"
          set +e
          ARCH=arm64 CROSS_COMPILE=aarch64-unknown-linux-gnu- make -j3 HOSTCFLAGS="-Wall -Wmissing-prototypes -Wstrict-prototypes -O2 -fomit-frame-pointer -std=gnu89 -fcommon" Image dtbs modules 2>&1 | tee -a "$LOG_FILE"
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e
          printf '\n===== BUILD EXIT STATUS: %s =====\n' "$BUILD_STATUS" | tee -a "$LOG_FILE"
          printf '===== NSPanel kernel build finished: %s =====\n' "$(date '+%Y-%m-%d %H:%M:%S %z')" | tee -a "$LOG_FILE"
          exit "$BUILD_STATUS"

      - name: Commit and push build log
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "${NSPANEL_BUILD_LOG:-}" ] || [ ! -f "$NSPANEL_BUILD_LOG" ]; then
            echo "No build log was generated; nothing to commit."
            exit 0
          fi
          LOG_NAME="$(basename "$NSPANEL_BUILD_LOG")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$LOG_NAME"
          if git diff --cached --quiet; then
            echo "Build log has no changes."
            exit 0
          fi
          git commit -m "Add NSPanel kernel build log"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nspanel-kernel-build-${{ github.run_id }}
          path: nspanel-kernel-build-*.log
          if-no-files-found: warn
          retention-days: 14
